<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#fdfcfa" />

    <!-- seo:start (rewritten per route by scripts/prerender.mjs) -->
    <title>SK Envision | Natural Hair &amp; Skin Care</title>
    <meta
      name="description"
      content="SK Envision natural hair and skin care: argan oil shampoo and conditioner, protein hair mask, hair regrowth serum, dark spot and collagen creams, and eyelash growth serum."
    />
    <meta property="og:site_name" content="SK Envision" />
    <meta property="og:title" content="SK Envision | Natural Hair &amp; Skin Care" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og/default.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- seo:end -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Inter+Tight:wght@500..800&display=swap"
    />

    <!-- lcp:start The hero image is the LCP element on the landing route. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/img/holiday-hero-1920.avif"
      imagesrcset="/img/holiday-hero-768.avif 768w, /img/holiday-hero-1280.avif 1280w, /img/holiday-hero-1920.avif 1920w"
      imagesizes="100vw"
    />
    <!-- lcp:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
